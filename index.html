  <style>
    /* MathJax CommonHTML — inline math stays in the text line */
    mjx-container[jax="CHTML"]:not([display="true"]):not([display="block"]) {
      display: inline !important;
      vertical-align: baseline;
    }

    /* Display equations: centered (matches MathJax chtml.displayAlign); inline unchanged above */
    mjx-container[jax="CHTML"][display="true"],
    mjx-container[jax="CHTML"][display="block"],
    mjx-container[display="block"] {
      display: block !important;
      margin: 0.65em auto !important;
      text-align: center !important;
    }

    /* Horizontal scroll slots — no vertical gutter/track beside horizontal scrollbar */
    .mathjax-scroll-x {
      overflow-y: hidden !important;
      scrollbar-width: thin;
      scrollbar-color: rgba(226, 183, 19, 0.55) rgba(45, 46, 50, 0.95);
    }

    .mathjax-scroll-x::-webkit-scrollbar {
      height: 7px;
    }

    .mathjax-scroll-x::-webkit-scrollbar-track {
      background: rgba(45, 46, 50, 0.9);
      border-radius: 4px;
    }

    .mathjax-scroll-x::-webkit-scrollbar-thumb {
      background: rgba(226, 183, 19, 0.42);
      border-radius: 4px;
    }

    .mathjax-scroll-x::-webkit-scrollbar-thumb:hover {
      background: rgba(226, 183, 19, 0.62);
    }
  </style>
